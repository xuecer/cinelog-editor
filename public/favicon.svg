<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 背景 -->
  <rect width="100" height="100" rx="20" fill="#1e293b"/>
  
  <!-- 胶片主体 -->
  <rect x="25" y="20" width="50" height="60" rx="4" fill="#334155"/>
  
  <!-- 胶片孔（上方） -->
  <rect x="28" y="24" width="6" height="6" rx="1" fill="#64748b"/>
  <rect x="66" y="24" width="6" height="6" rx="1" fill="#64748b"/>
  
  <!-- 中间画面框 -->
  <rect x="32" y="36" width="36" height="28" rx="2" fill="#0ea5e9"/>
  
  <!-- 胶片孔（下方） -->
  <rect x="28" y="70" width="6" height="6" rx="1" fill="#64748b"/>
  <rect x="66" y="70" width="6" height="6" rx="1" fill="#64748b"/>
  
  <!-- 编辑器笔触装饰 -->
  <line x1="40" y1="45" x2="60" y2="45" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="50" x2="55" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="55" x2="58" y2="55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>

